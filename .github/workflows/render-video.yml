name: Render video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', '.github/workflows/render-video.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Arabic font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Render 1080x1920 MP4
        run: npx remotion render src/index.ts CoachAd out/coach-ad.mp4 --codec h264 --concurrency 2
      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: coach-ad-mp4
          path: out/coach-ad.mp4
          if-no-files-found: error
